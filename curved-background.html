<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg-wrapper">
    <svg viewBox="0 0 1440 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
          <!-- 🔵 Blue at the start -->
          <stop offset="0%" stop-color="#5459AC"/> 
          <!-- 🟠 Orange at the end -->
          <stop offset="100%" stop-color="#5459AC"/>
        </linearGradient>
      </defs>
      <path fill="url(#gradient)" 
            d="M0,300 C300,350 600,200 900,300 C1200,400 1440,200 1440,200 L1440,0 L0,0 Z">
      </path>
    </svg>
  </div>
</body>
</html>
